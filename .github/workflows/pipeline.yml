name: Pipeline

# Deploy local via self-hosted runner rodando na maquina do professor.
#
#   push em `dev`  -> ambiente development -> container na porta 3501 -> dev.intelitech.shop
#   push em `main` -> ambiente production  -> container na porta 3500 -> prod.intelitech.shop
#
# Nao ha mais build/push para registry em nuvem nem SSH para VM: o proprio
# runner constroi a imagem e sobe o container com docker compose, e o
# cloudflared (repo intelitech-tf) expoe a porta publicamente.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    # Mantem o nome do environment para quem quiser configurar
    # regras/approvals no GitHub, mas nao e mais obrigatorio.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir ambiente alvo
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service=intelitech-front-prod" >> "$GITHUB_OUTPUT"
            echo "url=https://prod.intelitech.shop" >> "$GITHUB_OUTPUT"
          else
            echo "service=intelitech-front-dev" >> "$GITHUB_OUTPUT"
            echo "url=https://dev.intelitech.shop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + subir container (${{ steps.env.outputs.service }})
        run: |
          docker compose up -d --build --no-deps "${{ steps.env.outputs.service }}"

      - name: Limpar imagens antigas
        run: docker image prune -f

      - name: Resumo
        run: |
          echo "Deploy de ${{ github.ref_name }} concluido."
          echo "Servico: ${{ steps.env.outputs.service }}"
          echo "URL publica: ${{ steps.env.outputs.url }}"
