name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    defaults:
      run:
        shell: bash
    env: 
      OCI_CLI_USER: ${{ secrets.OCI_USERNAME }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_NAMESPACE }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION_KEY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT}}
      OCI_AUTH_TOKEN: ${{secrets.OCI_AUTH_TOKEN}}
      OCI_NAMESPACE_NAME: ${{ secrets.OCI_NAMESPACE_NAME }}

    steps:
      # Checkout source code
      - name: 'Checkout'
        uses: actions/checkout@v6
        
      - name: Log into OCIR
        run: |
          echo "${OCI_AUTH_TOKEN}" | docker login ${OCI_CLI_REGION}.ocir.io -u "${OCI_CLI_TENANCY}/${OCI_CLI_USER}" --password-stdin

      - name: 'Build and Push Docker Image'
        run: |
          docker build -t ${OCI_CLI_REGION}.ocir.io/${OCI_CLI_TENANCY}/${OCI_NAMESPACE_NAME}/intelitech-front:${{ github.sha }} .
          docker push ${OCI_CLI_REGION}.ocir.io/${OCI_CLI_TENANCY}/${OCI_NAMESPACE_NAME}/intelitech-front:${{ github.sha }}