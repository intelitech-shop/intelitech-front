name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    defaults:
      run:
        shell: bash

    steps:
      # Checkout source code
      - name: 'Checkout'
        uses: actions/checkout@v6
        
      # Log in to OCIR
      - name: 'Log in to OCIR'
        uses: oracle-actions/login-ocir@v1.3.0
        id: login-ocir
        with:
          auth_token: ${{ secrets.OCI_AUTH_TOKEN }}

      # Cache Docker layers to speed up builds
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build Docker image (uses cache)
      - name: Build Docker image
        run: |
          docker build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            -t ${{ secrets.OCI_REGION_KEY }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/intelitech-front:${{ github.sha }} .

  push-image:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
    defaults:
      run:
        shell: bash

    steps:
      # Checkout again (required for separate job context)
      - name: 'Checkout'
        uses: actions/checkout@v6

      # Log in to OCIR (required to push)
      - name: 'Log in to OCIR'
        uses: oracle-actions/login-ocir@v1.3.0
        id: login-ocir
        with:
          auth_token: ${{ secrets.OCI_AUTH_TOKEN }}

      # Push the image built in previous job
      - name: Push Docker image
        run: |
          docker push ${{ secrets.OCI_REGION_KEY }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/intelitech-front:${{ github.sha }}